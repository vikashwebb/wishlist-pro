# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ff8daa11716d4200164ee8824032e194"
name = "wishlist-pro"
# Placeholder — CLI sets the Cloudflare tunnel URL during `shopify app dev` when
# automatically_update_urls_on_dev is true. Set production URL in Partner Dashboard.
application_url = "https://example.com"
embedded = true

[build]
# true: local dev iframe hits your tunnel (localhost). false: iframe uses application_url above (breaks dev).
automatically_update_urls_on_dev = true
# false: `shopify app deploy` does not overwrite Partner Dashboard URLs from this file.
include_config_on_deploy = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_products,write_app_proxy,write_online_store_pages,read_themes"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "wishlist-proxy"
